<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
</head>



<body>

    <main class="container">
        <h2> Tablas </h2>
        <h3> Tabla básica</h3>

        <table border>
            <tr>
                <td>#Fila1, Celda1</td>
                <td>#Fila1, Celda2</td>
                <td>#Fila1, Celda3</td>
            </tr>

            <tr>
                <td>#Fila2, Celda1</td>
                <td>#Fila2, Celda2</td>
                <td>#Fila2, Celda3</td>
            </tr>
        </table>

        <h3> Tabla con encabezado</h3>

        <table border>
            <tbody>
            <tr>
                <th>#Fila1, Celda1</th>
                <th>#Fila1, Celda2</th>
                <th>#Fila1, Celda3</th>
            </tr>

            <tr>
                <td>#Fila2, Celda1</td>
                <td>#Fila2, Celda2</td>
                <td>#Fila2, Celda3</td>
            </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td>#Fila3, Celda1</td>
                    <td>#Fila3, Celda2</td>
                    <td>#Fila3, Celda3</td>
                </tr>
            </tfoot>
        </table>
        
    </main>
    
</body>
</html>
